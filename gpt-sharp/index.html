<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#080b10" />
<title>SHARP — Cognitive Training</title>
<style>
:root{--bg:#080b10;--p:#11161e;--p2:#181f29;--line:#26303d;--txt:#f4f7fa;--mut:#8c98a8;--a:#d8ff5b;--good:#98e66f;--bad:#ff7d7d;--r:18px}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,Segoe UI,sans-serif}button,input{font:inherit}button{-webkit-tap-highlight-color:transparent}.app{max-width:760px;margin:auto;min-height:100dvh;padding:calc(14px + env(safe-area-inset-top)) 16px calc(92px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;padding:8px 2px 18px}.logo{font-weight:900;letter-spacing:.24em}.dot{width:9px;height:9px;border-radius:50%;background:var(--a);box-shadow:0 0 18px var(--a)}h1{font-size:clamp(38px,11vw,58px);line-height:.96;letter-spacing:-.05em;margin:8px 0 12px}h2{font-size:24px;margin:0}h3{font-size:15px;margin:0}p{color:var(--mut);line-height:1.45}.eye{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--a);font-weight:850}.card{background:var(--p);border:1px solid var(--line);border-radius:var(--r);padding:18px}.card+.card{margin-top:10px}.hero{padding:18px 2px}.hero p{margin-bottom:0}.focus{background:linear-gradient(145deg,var(--p),rgba(216,255,91,.07))}.head{display:flex;justify-content:space-between;gap:12px}.chip{font-size:11px;font-weight:800;color:var(--a);border:1px solid rgba(216,255,91,.25);border-radius:999px;padding:7px 10px;height:max-content}.btn{border:0;border-radius:14px;min-height:52px;padding:0 16px;font-weight:850;cursor:pointer}.primary{background:var(--a);color:#101407}.secondary{background:var(--p2);color:var(--txt);border:1px solid var(--line)}.row{display:flex;gap:10px;margin-top:14px}.row .btn{flex:1}.section{display:flex;justify-content:space-between;align-items:end;margin:22px 2px 9px}.section span{font-size:12px;color:var(--mut)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.metric{background:var(--p);border:1px solid var(--line);border-radius:15px;padding:13px}.metric small{display:block;color:var(--mut);font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:750}.metric strong{display:block;font-size:22px;margin-top:6px}.game{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;background:var(--p);border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:9px;cursor:pointer}.ico{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:var(--p2);font-size:21px}.game p{font-size:12px;margin:3px 0 0}.lvl{text-align:right}.lvl small{font-size:10px;color:var(--mut)}.lvl strong{display:block}.bar{height:7px;border-radius:99px;background:var(--p2);overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:var(--a)}.drow{padding:9px 0}.dtop{display:flex;justify-content:space-between;font-size:13px}.nav{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:0;width:min(760px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:rgba(8,11,16,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}.nav button{border:0;background:none;color:var(--mut);min-height:52px;font-size:10px;font-weight:750}.nav b{display:block;font-size:18px;margin-bottom:3px}.nav .on{color:var(--txt)}.nav .on b{color:var(--a)}.session{min-height:calc(100dvh - env(safe-area-inset-top));display:flex;flex-direction:column}.shead{display:grid;grid-template-columns:44px 1fr 44px;gap:10px;align-items:center}.x{width:44px;height:44px;border-radius:13px;border:1px solid var(--line);background:var(--p);color:var(--txt)}.prog{height:5px;border-radius:99px;background:var(--p2);overflow:hidden}.prog i{height:100%;display:block;background:var(--a)}.qwrap{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:36px 4px 20px}.q{font-size:clamp(38px,12vw,72px);font-weight:900;line-height:1.05;letter-spacing:-.05em;white-space:pre-line}.q.compact{font-size:clamp(24px,7vw,40px);line-height:1.2}.sub{max-width:560px;margin:12px auto 0;color:var(--mut)}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.option{min-height:62px;border:1px solid var(--line);border-radius:15px;background:var(--p);color:var(--txt);font-weight:850;padding:10px}.form{display:flex;gap:10px}.input{min-width:0;flex:1;height:60px;border-radius:15px;border:1px solid var(--line);background:var(--p);color:var(--txt);font-size:24px;font-weight:850;padding:0 16px;outline:none}.input:focus{border-color:var(--a)}.submit{width:72px}.feedback{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);padding:11px 17px;border-radius:999px;font-weight:850;z-index:99}.ok{background:var(--good);color:#102008}.no{background:var(--bad);color:#2a0f0f}.score{text-align:center;padding:26px 0}.score .n{font-size:78px;font-weight:950;letter-spacing:-.08em}.score .n span{font-size:18px;color:var(--mut);letter-spacing:0}.empty{text-align:center;padding:28px;color:var(--mut);border:1px dashed var(--line);border-radius:var(--r)}.err{padding:20px;margin:20px;border:1px solid #7a3030;background:#281313;border-radius:16px;color:#fff}@media(max-width:420px){.grid3{grid-template-columns:repeat(3,1fr)}.metric{padding:11px}.metric strong{font-size:19px}}
</style>
</head>
<body>
<div id="root"><div class="app"><div class="top"><div class="logo">SHARP</div><div class="dot"></div></div><div class="card"><h2>Loading SHARP…</h2><p>If this stays here, open this page in Safari or Chrome.</p></div></div></div>
<script>
(()=>{'use strict';
const IDS=['arithmetic','estimation','logic','patterns','attention','flexibility','memory','strategy'];
const META={arithmetic:['Arithmetic','∑','Mental maths, percentages and ratios.'],estimation:['Estimation','≈','Fast approximation and magnitude judgement.'],logic:['Logic','◇','Deduction and conditional reasoning.'],patterns:['Patterns','⌁','Sequences, hidden rules and anomalies.'],attention:['Attention','◎','Interference control and inhibition.'],flexibility:['Flexibility','⇄','Switch rules without carrying the old one forward.'],memory:['Working Memory','▦','Hold, reverse and manipulate information.'],strategy:['Verbal + Strategy','↗','Language, expected value and decision quality.']};
const root=document.getElementById('root'),K='sharp-hosted-v1'; let page='today',active=null;
const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pk=a=>a[Math.floor(Math.random()*a.length)],sh=a=>[...a].sort(()=>Math.random()-.5),med=a=>{let b=[...a].sort((x,y)=>x-y),m=Math.floor(b.length/2);return b.length%2?b[m]:(b[m-1]+b[m])/2},cl=(n,a,b)=>Math.max(a,Math.min(b,n));
function fresh(){return{v:1,stats:{streak:0,sessions:0,minutes:0,last:null},domains:Object.fromEntries(IDS.map(id=>[id,{level:1,score:50,attempts:0,last:null,best:0}])),history:[]}}
function load(){try{return Object.assign(fresh(),JSON.parse(localStorage.getItem(K)||'null')||{})}catch(e){return fresh()}} let S=load();
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function key(){let d=new Date();return d.toISOString().slice(0,10)}
function days(a){return a?Math.floor((Date.now()-new Date(a).getTime())/86400000):99}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function opts(ans,ds){return sh([ans,...ds.filter(x=>String(x)!==String(ans))]).slice(0,4)}
function arithmetic(l){let t=l<4?pk(['+','−','×']):pk(['+','−','×','÷','%','chg']);if(t==='+'){let a=ri(12,50+l*35),b=ri(8,40+l*25);return n(`${a} + ${b}`,a+b)}if(t==='−'){let a=ri(40,80+l*40),b=ri(5,a-2);return n(`${a} − ${b}`,a-b)}if(t==='×'){let a=ri(3,8+l*2),b=ri(3,8+l*2);return n(`${a} × ${b}`,a*b)}if(t==='÷'){let b=ri(2,7+l),x=ri(3,10+l*2);return n(`${b*x} ÷ ${b}`,x)}if(t==='%'){let p=pk([5,10,12.5,15,20,25,30,40]),b=pk([80,120,160,200,240,320,400,600,800,1200]);return n(`${p}% of ${b}`,b*p/100)}let p=pk([5,10,15,20,25]),b=ri(10,60)*10;return n(`${b} increased by ${p}%`,b*(1+p/100))}
function estimation(l){let a=ri(12,70+l*16),b=ri(8,45+l*10),ans=a*b,d=cl(Math.round(ans*(.08+.015*l)),6,300),o=opts(ans,[ans-d,ans+d,ans+2*d]);return c(`Estimate ${a} × ${b}`,o,ans,'Choose the closest value.')}
const NAMES=['Ava','Ben','Cleo','Dane','Eli','Faye'];
function logic(l){if(Math.random()<.5){let a=pk(NAMES),b=pk(NAMES.filter(x=>x!==a)),c1=pk(NAMES.filter(x=>x!==a&&x!==b));let pr=`${a} is older than ${b}.\n${b} is older than ${c1}.`;return c(pr,['Definitely true','Definitely false','Cannot determine'],'Definitely true',`Is “${a} is older than ${c1}” supported?`)}let x=pk(['red','square','metal','large']),y=pk(['warm','heavy','approved','visible']);return c(`All ${x} items are ${y}.\nItem Q is ${x}.`,['Q must be '+y,'Q cannot be '+y,'Cannot determine'],'Q must be '+y,'Choose the valid conclusion.')}
function patterns(l){let type=pk(['add','alt','mul']);if(type==='add'){let s=ri(2,12),d=ri(2,5+l),arr=[0,1,2,3].map(i=>s+i*d),ans=s+4*d;return c(`${arr.join('   ')}   ?`,opts(ans,[ans+d,ans-d,ans+2*d]),ans,'Complete the sequence.')}if(type==='mul'){let s=ri(1,4),m=pk([2,3]),arr=[s,s*m,s*m*m,s*m*m*m],ans=s*m*m*m*m;return c(`${arr.join('   ')}   ?`,opts(ans,[ans/m,ans+m,ans*2]),ans,'Complete the sequence.')}let s=ri(2,10),a=ri(2,4+l),b=ri(1,3+l),arr=[s,s+a,s+a-b,s+2*a-b,s+2*a-2*b],ans=s+3*a-2*b;return c(`${arr.join('   ')}   ?`,opts(ans,[ans-a,ans+b,ans+a]),ans,'Alternating rules are active.')}
function attention(l){let dirs=['LEFT','RIGHT'],word=pk(dirs),arrow=pk(['←','→']),ans=arrow==='←'?'LEFT':'RIGHT';return c(`${word}\n${arrow}`,['LEFT','RIGHT'],ans,'Ignore the word. Answer the ARROW direction.')}
function flexibility(l){let rule=active&&active.prevRule==='parity'?'size':'parity',val=ri(1,20);if(Math.random()<.35)rule=active&&active.prevRule? (active.prevRule==='parity'?'size':'parity'):pk(['parity','size']);let ans=rule==='parity'?(val%2?'ODD':'EVEN'):(val>10?'HIGH':'LOW');return c(String(val),rule==='parity'?['EVEN','ODD']:['HIGH','LOW'],ans,rule==='parity'?'RULE: classify EVEN / ODD':'RULE: HIGH if >10, otherwise LOW',{rule})}
function memory(l){let len=cl(3+Math.floor(l/2),3,8),arr=Array.from({length:len},()=>ri(1,9)),ans=[...arr].reverse().join('');return{kind:'memory',prompt:arr.join('   '),answer:ans,sub:'Memorise this sequence. You will enter it in reverse.',display:cl(2600-l*120,1200,2600)}}
const WORDS=[['rapid','fast'],['scarce','rare'],['robust','strong'],['obscure','unclear'],['concise','brief'],['novel','new']];
function strategy(l){if(Math.random()<.5){let [w,a]=pk(WORDS),wrong=sh(WORDS.filter(x=>x[0]!==w).map(x=>x[1])).slice(0,3);return c(`Closest meaning of “${w}”`,opts(a,wrong),a,'Verbal reasoning.')}let p1=pk([.4,.5,.6,.7]),r1=pk([80,100,120,150]),p2=pk([.3,.45,.55,.65]),r2=pk([100,140,180,220]),ev1=Math.round(p1*r1),ev2=Math.round(p2*r2),ans=ev1>=ev2?'Option A':'Option B';return c(`A: ${Math.round(p1*100)}% chance of +${r1}\nB: ${Math.round(p2*100)}% chance of +${r2}`,['Option A','Option B'],ans,`Choose higher expected payoff. EVs: A=${ev1}, B=${ev2}`)}
function n(prompt,answer){return{kind:'number',prompt,answer,sub:'Enter the exact answer.'}} function c(prompt,options,answer,sub='',meta={}){return{kind:'choice',prompt,options,answer,sub,meta}}
function gen(id,l){return({arithmetic,estimation,logic,patterns,attention,flexibility,memory,strategy}[id])(l)}
function correct(q,r){if(q.kind==='number')return Math.abs(Number(r)-Number(q.answer))<.011;return String(r).trim().toLowerCase()===String(q.answer).trim().toLowerCase()}
function target(id){return{attention:2200,flexibility:3000,memory:7000,logic:8500,strategy:8500,patterns:6000,estimation:5000,arithmetic:5500}[id]}
function score(acc,ms,l,id){let speed=cl(target(id)/Math.max(500,ms),.45,1.3);return cl(Math.round(acc*58+speed*22+l*2),0,100)}
function adapt(l,acc,ms,id){if(acc>=.9&&ms<target(id)*1.2)return cl(l+1,1,10);if(acc<.62)return cl(l-1,1,10);return l}
function choose(count){let a=IDS.map(id=>{let d=S.domains[id];return{id,p:(100-d.score)+days(d.last)*2+Math.random()*12}}).sort((x,y)=>y.p-x.p);let out=a.slice(0,count-1).map(x=>x.id),strong=[...a].sort((x,y)=>S.domains[y.id].score-S.domains[x.id].score).find(x=>!out.includes(x.id));if(strong)out.push(strong.id);return out.slice(0,count)}
function nav(){return`<nav class="nav">${[['today','⌂','Today'],['train','▶','Train'],['performance','⌁','Performance'],['games','◇','Games']].map(x=>`<button data-nav="${x[0]}" class="${page===x[0]?'on':''}"><b>${x[1]}</b>${x[2]}</button>`).join('')}</nav>`}
function shell(x){return`<div class="app"><div class="top"><div class="logo">SHARP</div><div class="dot"></div></div>${x}</div>${nav()}`}
function index(){let tr=IDS.filter(id=>S.domains[id].attempts),v=tr.length>=4?Math.round(tr.reduce((a,id)=>a+S.domains[id].score,0)/tr.length-(8-tr.length)*2):null;return{v,tr}}
function focus(){return choose(5)[0]}
function drow(id){let d=S.domains[id],v=d.attempts?d.score:0;return`<div class="drow"><div class="dtop"><span>${META[id][0]}</span><b>${d.attempts?d.score:'BASELINE'}</b></div><div class="bar"><i style="width:${v}%"></i></div></div>`}
function game(id,practice=true,badge=''){let d=S.domains[id];return`<div class="game" ${practice?`data-practice="${id}"`:''}><div class="ico">${META[id][1]}</div><div><h3>${META[id][0]}</h3><p>${META[id][2]}</p></div><div class="lvl"><small>${badge?'BLOCK':'LEVEL'}</small><strong>${badge||d.level}</strong></div></div>`}
function today(){let f=focus(),ix=index();root.innerHTML=shell(`<section class="hero"><div class="eye">Daily cognitive training</div><h1>Train what<br>actually slips.</h1><p>Calculation, memory, attention, reasoning and decision quality — under adaptive pressure.</p></section><section class="card focus"><div class="head"><div><div class="eye">Today's priority</div><h2 style="margin-top:7px">${META[f][0]}</h2></div><span class="chip">LEVEL ${S.domains[f].level}</span></div><p>${S.domains[f].attempts?'Selected from weakness and training recency.':'Baseline data needed for this domain.'}</p><div class="row"><button class="btn primary" data-start="standard">Start Standard</button><button class="btn secondary" data-start="quick">Quick</button></div></section><div class="section"><h3>Current signal</h3><span>${ix.tr.length}/8 trained</span></div><div class="grid3"><div class="metric"><small>Sharpness</small><strong>${ix.v??'—'}</strong></div><div class="metric"><small>Streak</small><strong>${S.stats.streak}d</strong></div><div class="metric"><small>Minutes</small><strong>${Math.round(S.stats.minutes)}</strong></div></div><div class="section"><h3>Training map</h3></div><section class="card">${IDS.map(drow).join('')}</section>`)}
function train(){let s=choose(5);root.innerHTML=shell(`<section class="hero"><div class="eye">Session control</div><h1>Choose the<br>pressure.</h1><p>Quick uses 3 blocks. Standard uses 5 and rotates weaknesses with one maintenance strength.</p></section><div class="grid2"><section class="card"><div class="eye">Quick</div><h2 style="margin-top:7px">8–10m</h2><p>Fast daily circuit.</p><button class="btn primary" data-start="quick" style="width:100%">Start</button></section><section class="card"><div class="eye">Standard</div><h2 style="margin-top:7px">20–25m</h2><p>Primary training mode.</p><button class="btn primary" data-start="standard" style="width:100%">Start</button></section></div><div class="section"><h3>Suggested blocks</h3></div>${s.map((id,i)=>game(id,false,String(i+1))).join('')}`)}
function performance(){let ix=index(),hist=[...S.history].reverse().slice(0,8);root.innerHTML=shell(`<section class="hero"><div class="eye">Performance intelligence</div><h1>${ix.v??'—'}<span style="font-size:.32em;color:var(--mut)"> /100</span></h1><p>${ix.v==null?'Train at least four domains before the index appears.':'Internal training index — not an IQ score.'}</p></section><div class="grid3"><div class="metric"><small>Sessions</small><strong>${S.stats.sessions}</strong></div><div class="metric"><small>Domains</small><strong>${ix.tr.length}/8</strong></div><div class="metric"><small>Streak</small><strong>${S.stats.streak}d</strong></div></div><div class="section"><h3>Domain profile</h3></div><section class="card">${IDS.map(drow).join('')}</section><div class="section"><h3>Recent sessions</h3></div>${hist.length?hist.map(h=>`<div class="game"><div class="ico">${h.score}</div><div><h3>${h.mode} session</h3><p>${new Date(h.date).toLocaleDateString()} · ${h.results.length} blocks</p></div><div class="lvl"><small>SCORE</small><strong>${h.score}</strong></div></div>`).join(''):'<div class="empty">No completed sessions yet.</div>'}`)}
function games(){root.innerHTML=shell(`<section class="hero"><div class="eye">Practice lab</div><h1>Target one<br>system.</h1><p>Practise any domain independently. Practice rounds do not change your daily streak.</p></section>${IDS.map(id=>game(id,true)).join('')}`)}
function render(){if(active?.screen==='question')return question();if(active?.screen==='blockResult')return blockResult();if(active?.screen==='sessionResult')return sessionResult();({today,train,performance,games}[page]||today)()}
function start(mode,only){let ids=only?[only]:choose(mode==='quick'?3:5);active={screen:'question',mode,ids,bi:0,results:[],practice:!!only,start:Date.now()};begin()}
function begin(){let id=active.ids[active.bi],d=S.domains[id];Object.assign(active,{id,q:null,qi:0,count:id==='attention'||id==='flexibility'?10:6,good:0,times:[],errors:[],prevRule:null,memoryHide:false});next()}
function next(){if(active.qi>=active.count)return finishBlock();let q=gen(active.id,S.domains[active.id].level);active.q=q;active.qStart=performance.now();if(q.kind==='memory'){active.memoryHide=false;render();setTimeout(()=>{if(active&&active.q===q){active.memoryHide=true;active.qStart=performance.now();render()}},q.display)}else render()}
function question(){let q=active.q,overall=((active.bi+active.qi/active.count)/active.ids.length)*100,mem=q.kind==='memory'&&!active.memoryHide;root.innerHTML=`<div class="app"><main class="session"><div class="shead"><button class="x" data-exit>×</button><div class="prog"><i style="width:${overall}%"></i></div><div style="text-align:right;font-size:12px;color:var(--mut)">${active.bi+1}/${active.ids.length}</div></div><div class="qwrap"><div class="eye">${META[active.id][0]} · Level ${S.domains[active.id].level}</div><div class="q ${q.prompt.length>45?'compact':''}" style="margin-top:16px">${esc(mem?q.prompt:(q.kind==='memory'?'Enter reverse sequence':q.prompt))}</div><div class="sub">${esc(mem?'Hold it.':q.sub||'')}</div></div><div>${mem?'<div class="bar"><i style="width:100%"></i></div>':answerUI(q)}</div></main></div>`;if(!mem&&q.kind!=='choice')setTimeout(()=>document.getElementById('ans')?.focus(),30)}
function answerUI(q){if(q.kind==='choice')return`<div class="options">${q.options.map(o=>`<button class="option" data-answer="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;return`<form class="form" id="form"><input class="input" id="ans" inputmode="${q.kind==='number'?'decimal':'numeric'}" autocomplete="off" placeholder="Answer"><button class="btn primary submit" type="submit">→</button></form>`}
function answer(r){if(!active||active.screen!=='question')return;let ms=performance.now()-active.qStart,ok=correct(active.q,r);active.times.push(ms);if(ok)active.good++;else active.errors.push(ms<850?'impulsive':'incorrect');if(active.id==='flexibility')active.prevRule=active.q.meta?.rule||active.prevRule;flash(ok,active.q.answer);active.qi++;setTimeout(next,260)}
function flash(ok,a){let d=document.createElement('div');d.className='feedback '+(ok?'ok':'no');d.textContent=ok?'Correct':'Answer: '+a;document.body.appendChild(d);setTimeout(()=>d.remove(),600)}
function finishBlock(){let id=active.id,d=S.domains[id],acc=active.good/active.count,ms=med(active.times),sc=score(acc,ms,d.level,id),nl=adapt(d.level,acc,ms,id),r={id,acc,ms,score:sc,level:d.level,next:nl};if(!active.practice){d.score=d.attempts?Math.round(d.score*.7+sc*.3):sc;d.level=nl;d.attempts+=active.count;d.last=new Date().toISOString();d.best=Math.max(d.best,sc);save()}active.results.push(r);active.screen='blockResult';render()}
function blockResult(){let r=active.results.at(-1);root.innerHTML=`<div class="app"><div class="score"><div class="eye">${active.practice?'Practice':'Block complete'}</div><h2 style="margin:8px 0">${META[r.id][0]}</h2><div class="n">${r.score}<span>/100</span></div></div><div class="grid2"><div class="metric"><small>Accuracy</small><strong>${Math.round(r.acc*100)}%</strong></div><div class="metric"><small>Median speed</small><strong>${(r.ms/1000).toFixed(2)}s</strong></div><div class="metric"><small>Difficulty</small><strong>${r.level}→${r.next}</strong></div><div class="metric"><small>Status</small><strong style="font-size:15px">${r.acc<.65?'Too hard':r.acc>.9?'Progress':'Productive'}</strong></div></div><button class="btn primary" style="width:100%;margin-top:14px" data-next>${active.practice?'Back to Games':active.bi+1>=active.ids.length?'Finish Session':'Next Block'}</button></div>`}
function nextBlock(){if(active.practice){active=null;page='games';return render()}if(++active.bi>=active.ids.length)return finishSession();active.screen='question';begin()}
function finishSession(){let mins=(Date.now()-active.start)/60000,sc=Math.round(active.results.reduce((a,r)=>a+r.score,0)/active.results.length),today=key();if(S.stats.last!==today){if(S.stats.last&&Math.round((new Date(today)-new Date(S.stats.last))/86400000)===1)S.stats.streak++;else S.stats.streak=1}S.stats.last=today;S.stats.sessions++;S.stats.minutes+=mins;let h={date:new Date().toISOString(),mode:active.mode,score:sc,results:active.results,minutes:mins};S.history.push(h);S.history=S.history.slice(-60);save();active={screen:'sessionResult',h};render()}
function sessionResult(){let h=active.h,b=[...h.results].sort((a,b)=>b.score-a.score),w=b.at(-1);root.innerHTML=`<div class="app"><div class="score"><div class="eye">Session complete</div><h2 style="margin:8px 0">${h.mode} training</h2><div class="n">${h.score}<span>/100</span></div><p>${w.acc<.7?META[w.id][0]+' produced the highest error pressure.':'Performance stayed balanced; difficulty can rise selectively.'}</p></div><div class="grid2"><div class="metric"><small>Strongest</small><strong style="font-size:15px">${META[b[0].id][0]}</strong></div><div class="metric"><small>Constraint</small><strong style="font-size:15px">${META[w.id][0]}</strong></div><div class="metric"><small>Blocks</small><strong>${h.results.length}</strong></div><div class="metric"><small>Streak</small><strong>${S.stats.streak}d</strong></div></div><button class="btn primary" style="width:100%;margin-top:14px" data-done>Return to Today</button></div>`}
document.addEventListener('click',e=>{let n=e.target.closest('[data-nav]');if(n){active=null;page=n.dataset.nav;return render()}let s=e.target.closest('[data-start]');if(s)return start(s.dataset.start);let p=e.target.closest('[data-practice]');if(p)return start('practice',p.dataset.practice);let a=e.target.closest('[data-answer]');if(a)return answer(a.dataset.answer);if(e.target.closest('[data-next]'))return nextBlock();if(e.target.closest('[data-done]')){active=null;page='today';return render()}if(e.target.closest('[data-exit]')){if(confirm('Exit this block?')){active=null;page='today';render()}}});
document.addEventListener('submit',e=>{if(e.target.id==='form'){e.preventDefault();let v=document.getElementById('ans').value.trim();if(v)answer(v)}});
window.addEventListener('error',e=>{root.innerHTML=`<div class="err"><b>SHARP runtime error</b><br><br>${esc(e.message||'Unknown error')}</div>`});render();
})();
</script>
</body></html>
