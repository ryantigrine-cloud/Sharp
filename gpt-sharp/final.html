<!doctype html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>SHARP</title>
<style>
:root{--bg:#080b10;--p:#11161e;--p2:#181f29;--line:#26303d;--txt:#f4f7fa;--mut:#8c98a8;--a:#d8ff5b;--good:#98e66f;--bad:#ff7d7d;--r:18px}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,Segoe UI,sans-serif;overscroll-behavior:none}button,input{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;min-height:100dvh;padding:calc(14px + env(safe-area-inset-top)) 16px calc(92px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;padding:8px 2px 18px}.logo{font-weight:900;letter-spacing:.24em}.dot{width:9px;height:9px;border-radius:50%;background:var(--a);box-shadow:0 0 18px var(--a)}h1{font-size:clamp(38px,11vw,58px);line-height:.96;letter-spacing:-.05em;margin:8px 0 12px}h2{font-size:24px;margin:0}h3{font-size:15px;margin:0}p{color:var(--mut);line-height:1.45}.eye{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--a);font-weight:850}.card{background:var(--p);border:1px solid var(--line);border-radius:var(--r);padding:18px}.card+.card{margin-top:10px}.hero{padding:18px 2px}.hero p{margin-bottom:0}.focus{background:linear-gradient(145deg,var(--p),rgba(216,255,91,.07))}.head{display:flex;justify-content:space-between;gap:12px}.chip{font-size:11px;font-weight:800;color:var(--a);border:1px solid rgba(216,255,91,.25);border-radius:999px;padding:7px 10px;height:max-content}.btn{border:0;border-radius:14px;min-height:52px;padding:0 16px;font-weight:850}.primary{background:var(--a);color:#101407}.secondary{background:var(--p2);color:var(--txt);border:1px solid var(--line)}.row{display:flex;gap:10px;margin-top:14px}.row .btn{flex:1}.section{display:flex;justify-content:space-between;align-items:end;margin:22px 2px 9px}.section span{font-size:12px;color:var(--mut)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.metric{background:var(--p);border:1px solid var(--line);border-radius:15px;padding:13px}.metric small{display:block;color:var(--mut);font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:750}.metric strong{display:block;font-size:22px;margin-top:6px}.game{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;background:var(--p);border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:9px}.ico{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:var(--p2);font-size:21px}.game p{font-size:12px;margin:3px 0 0}.lvl{text-align:right}.lvl small{font-size:10px;color:var(--mut)}.lvl strong{display:block}.bar{height:7px;border-radius:99px;background:var(--p2);overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:var(--a)}.drow{padding:9px 0}.dtop{display:flex;justify-content:space-between;font-size:13px}.nav{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:0;width:min(760px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:rgba(8,11,16,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}.nav button{border:0;background:none;color:var(--mut);min-height:52px;font-size:10px;font-weight:750}.nav b{display:block;font-size:18px;margin-bottom:3px}.nav .on{color:var(--txt)}.nav .on b{color:var(--a)}.session{min-height:calc(100dvh - env(safe-area-inset-top));display:flex;flex-direction:column}.shead{display:grid;grid-template-columns:44px 1fr 60px;gap:10px;align-items:center}.x{width:44px;height:44px;border-radius:13px;border:1px solid var(--line);background:var(--p);color:var(--txt)}.timer{font-variant-numeric:tabular-nums;text-align:right;font-weight:850;font-size:13px}.prog{height:5px;border-radius:99px;background:var(--p2);overflow:hidden}.prog i{height:100%;display:block;background:var(--a)}.prog i.low{background:var(--bad)}.qwrap{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:28px 4px 18px}.q{font-size:clamp(38px,12vw,72px);font-weight:900;line-height:1.05;letter-spacing:-.05em;white-space:pre-line}.q.compact{font-size:clamp(24px,7vw,40px);line-height:1.2}.sub{max-width:560px;margin:12px auto 0;color:var(--mut);white-space:pre-line}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.option{min-height:62px;border:1px solid var(--line);border-radius:15px;background:var(--p);color:var(--txt);font-weight:850;padding:10px}.form{display:flex;gap:10px}.input{min-width:0;flex:1;height:60px;border-radius:15px;border:1px solid var(--line);background:var(--p);color:var(--txt);font-size:24px;font-weight:850;padding:0 16px;outline:none}.input:focus{border-color:var(--a)}.submit{width:72px}.feedback{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);padding:11px 17px;border-radius:999px;font-weight:850;z-index:99}.ok{background:var(--good);color:#102008}.no{background:var(--bad);color:#2a0f0f}.score{text-align:center;padding:26px 0}.score .n{font-size:78px;font-weight:950;letter-spacing:-.08em}.score .n span{font-size:18px;color:var(--mut);letter-spacing:0}.empty{text-align:center;padding:28px;color:var(--mut);border:1px dashed var(--line);border-radius:var(--r)}.matrix{width:min(330px,88vw);margin:22px auto 8px;display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.mcell{aspect-ratio:1;border:1px solid var(--line);border-radius:12px;background:var(--p);display:grid;place-items:center;font-size:clamp(24px,8vw,38px);font-weight:850;white-space:pre-line}.mcell.miss{border-style:dashed;color:var(--a)}.matrixAnswers,.patternAnswers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mcell .miniGrid{width:72%;height:72%;padding:2px;gap:2px;border-radius:6px}.matrixOption{min-height:82px;border:1px solid var(--line);border-radius:16px;background:var(--p);color:var(--txt);font-size:34px;font-weight:850;display:grid;place-items:center}.miniGrid{display:grid;gap:4px;background:var(--line);padding:4px;border-radius:12px;width:min(180px,48vw);aspect-ratio:1}.miniGrid i{display:block;background:var(--p);border-radius:4px}.miniGrid i.on{background:var(--txt)}.patternOption{min-height:128px;border:1px solid var(--line);border-radius:16px;background:var(--p);color:var(--txt);display:grid;place-items:center;padding:12px}.patternOption .miniGrid{width:min(110px,28vw)}.matrixOption .miniGrid{width:min(90px,24vw)}.routeGrid{display:grid;gap:4px;width:min(340px,88vw);margin:20px auto;background:var(--line);padding:4px;border-radius:14px}.routeCell{aspect-ratio:1;background:var(--p);display:grid;place-items:center;border-radius:5px;font-size:12px;font-weight:900}.routeCell.wall{background:#29313c}.routeCell.start{background:var(--a);color:#101407}.routeCell.goal{background:#f4f7fa;color:#101407}.reflexWrap{flex:1;display:flex;align-items:center;justify-content:center}.reflexPad{width:min(430px,92vw);height:min(430px,58vh);border-radius:28px;border:1px solid var(--line);background:var(--p);color:var(--txt);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;user-select:none;touch-action:manipulation}.reflexPad.go{background:var(--a);color:#101407;border-color:var(--a)}.reflexPad.bad{background:#321919;border-color:#7a3030}.reflexPad .bolt{font-size:58px}.wordbuild{min-height:54px;border-bottom:2px solid var(--line);display:grid;place-items:center;font-size:30px;font-weight:850;letter-spacing:.08em}.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px 0}.tile{width:48px;height:56px;border:1px solid var(--line);border-radius:12px;background:var(--p2);color:var(--a);font-size:22px;font-weight:900}.tile:disabled{opacity:.22}.wordactions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.wordactions button{min-height:50px}.found{color:var(--mut);font-size:12px;line-height:1.6;min-height:36px}.err{padding:20px;margin:20px;border:1px solid #7a3030;background:#281313;border-radius:16px;color:#fff}@media(max-width:420px){.metric{padding:11px}.metric strong{font-size:19px}}
</style>
